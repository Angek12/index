name: Weekly database backup

# Needs one repository secret called DATABASE_URL: the Neon connection string,
# for example postgresql://user:password@host/dbname?sslmode=require
# The backup is kept for 30 days under Actions > this run > Artifacts.

on:
  schedule:
    - cron: '0 2 * * 0'      # every Sunday at 02:00 UTC
  workflow_dispatch:         # lets you start it by hand

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install the PostgreSQL 17 client
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg lsb-release
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Dump the database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "Add the DATABASE_URL secret first"; exit 1; fi
          /usr/lib/postgresql/17/bin/pg_dump "$DATABASE_URL" --no-owner --no-privileges | gzip > "index-backup-$(date +%F).sql.gz"
          ls -lh index-backup-*.sql.gz

      - name: Keep the backup
        uses: actions/upload-artifact@v4
        with:
          name: index-database-backup
          path: index-backup-*.sql.gz
          retention-days: 30
