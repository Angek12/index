services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: index_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d index_db"]
      interval: 5s
      retries: 10
  api:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
    environment:
      DB_URL: jdbc:postgresql://db:5432/index_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: dev-secret-dev-secret-dev-secret-dev-secret
      ADMIN_EMAIL: admin@index.rw
      ADMIN_PASSWORD: ChangeMe123!
      CORS_ORIGINS: http://localhost:5173
    ports: ["8080:8080"]
  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    depends_on: [api]
    ports: ["5173:80"]
volumes:
  pgdata:
